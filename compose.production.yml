name: agent-studio-production
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_studio}
      POSTGRES_USER: ${POSTGRES_USER:-agentstudio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    image: agent-studio-server:local
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file: .env
    environment: &server_environment
      DATABASE_URL: postgres://${POSTGRES_USER:-agentstudio}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-agent_studio}
      PORT: "3020"
      UPLOAD_ROOT: /data/uploads
    command: ["npm", "run", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    image: agent-studio-server:local
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file: .env
    environment: *server_environment
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3020/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  worker:
    image: agent-studio-server:local
    env_file: .env
    environment: *server_environment
    command: ["node", "dist/worker.js"]
    volumes:
      - uploads:/data/uploads
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  edge:
    build:
      context: .
      dockerfile: deploy/edge.Dockerfile
    ports:
      - "${EDGE_BIND_IP:-127.0.0.1}:${EDGE_PORT:-8075}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  uploads:
